
apiVersion: apps/v1
kind: Deployment
metadata:
  name: courses-service
  namespace: edutech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: courses-service
  template:
    metadata:
      labels:
        app: courses-service
    spec:
      containers:
        - name: courses-service
          image: courses-service:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
          env:
            - name: LATENCY_MS
              value: "0"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: courses-service
  namespace: edutech
spec:
  selector:
    app: courses-service
  ports:
    - name: http
      port: 8001
      targetPort: http
      protocol: TCP
    - name: grpc
      appProtocol: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
  type: ClusterIP
