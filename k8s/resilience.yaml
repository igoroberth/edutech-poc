
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: courses-resilience
  namespace: edutech
spec:
  host: courses-service.edutech.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
