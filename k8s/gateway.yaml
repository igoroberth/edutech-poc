
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: edutech-gateway
  namespace: edutech
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: edutech-routing
  namespace: edutech
spec:
  hosts:
    - "*"
  gateways:
    - edutech-gateway
  http:

    - match:
        - uri:
            prefix: /api/courses
      rewrite:
        uri: /courses
      timeout: 5s
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,reset,connect-failure
      route:
        - destination:
            host: courses-service.edutech.svc.cluster.local
            port:
              number: 8001
    - match:
        - uri:
            prefix: /api/enrollments
      rewrite:
        uri: /enrollments
      route:
        - destination:
            host: enrollment-service.edutech.svc.cluster.local
            port:
              number: 8002
