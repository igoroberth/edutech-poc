
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-service
  namespace: edutech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enrollment-service
  template:
    metadata:
      labels:
        app: enrollment-service
    spec:
      containers:
        - name: enrollment-service
          image: enrollment-service:1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: COURSES_GRPC
              value: "courses-service:50051"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: enrollment-service
  namespace: edutech
spec:
  selector:
    app: enrollment-service
  ports:
    - name: http
      port: 8002
      targetPort: http
      protocol: TCP
  type: ClusterIP

