events {}

http {
  # DNS interno do Docker; resolução tardia permite o gateway subir mesmo se um serviço estiver fora
  resolver 127.0.0.11 valid=5s;

  # Rate limiting no gateway: 20 req/s por IP (rajada de 20)
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  server {
    listen 8080;

    # ID de correlação para rastrear a requisição nos logs dos serviços
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    limit_req zone=api burst=20 nodelay;

    location /api/courses {
      set $courses_upstream http://courses-service:8001;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $courses_upstream;
    }

    location /api/enrollments {
      set $enrollment_upstream http://enrollment-service:8002;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $enrollment_upstream;
    }

    location /health {
      return 200 "gateway ok\n";
    }
  }
}
