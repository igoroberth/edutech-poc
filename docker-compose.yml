services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8081:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - courses-service
      - enrollment-service

  courses-service:
    build:
      context: .
      dockerfile: courses-service/Dockerfile
    environment:
      LATENCY_MS: "0"        # aumente (ex.: 1500) para simular lentidão e testar timeout
    expose:
      - "8001"
      - "50051"

  enrollment-service:
    build:
      context: .
      dockerfile: enrollment-service/Dockerfile
    environment:
      COURSES_GRPC: courses-service:50051
    expose:
      - "8002"
    depends_on:
      - courses-service
